[package]
name = "wasm-pkg-client"
description = "Wasm package client"
repository = "https://github.com/bytecodealliance/wasm-pkg-tools/tree/main/crates/wasm-pkg-client"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../README.md"

[features]
default = ["native", "docker-tests"]
# This feature enables tests that use Docker
docker-tests = []
# Native target: uses oci-client/oci-wasm/reqwest for HTTP transport.
native = [
    "dep:docker_credential",
    "dep:oci-client",
    "dep:oci-wasm",
    "dep:reqwest",
    "dep:tokio-util",
    "dep:warg-client",
    "dep:warg-crypto",
    "dep:warg-protocol",
    "dep:wit-component",
    "wasm-pkg-common/registry-config-fs",
]
# Wasm target: uses wstd::http for HTTP transport.
wasm = ["dep:wstd", "wasm-pkg-common/registry-config"]

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1.77"
base64 = { workspace = true }
bytes = { workspace = true }
etcetera = { workspace = true }
futures-util = { workspace = true, features = ["io"] }
secrecy = { version = "0.8", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2.5.0"
wasm-metadata = { workspace = true }
wasm-pkg-common = { workspace = true }

# native-only deps (not needed in wasm target)
tokio-util = { workspace = true, features = ["io", "io-util", "codec"], optional = true }
warg-client = { version = "0.9.2", optional = true }
warg-crypto = { version = "0.9.2", optional = true }
warg-protocol = { version = "0.9.2", optional = true }
wit-component = { workspace = true, optional = true }

# --- feature-gated deps ---
docker_credential = { workspace = true, optional = true }
oci-client = { workspace = true, optional = true }
oci-wasm = { workspace = true, optional = true }
reqwest = { version = "0.12.0", optional = true, default-features = false, features = [
    "charset",
    "http2",
    "json",
    "macos-system-configuration",
    "rustls-tls",
]}
wstd = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = { workspace = true }
